name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: pure-logic unit tests (provider parsing, enum mappings). These run against the
  # compiled main output + JUnit only, so this job never downloads the multi-GB Rider archive.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run unit tests
        run: ./gradlew unitTest

  # Full build: compile against Rider, run platform-touching tests, and verify plugin compatibility
  # against the pinned Rider build. Downloads the Rider archive (cached across runs).
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Write the Gradle user-home cache from every branch/PR, not just the default
          # branch, so the Rider distribution the IntelliJ Platform Gradle Plugin
          # downloads into GRADLE_USER_HOME is restored on later runs, not re-fetched.
          cache-read-only: false

      - name: Build, test, and verify plugin
        run: ./gradlew build test verifyPlugin
